<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GitHub Profile Finder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <p>BHUPAL SINGH BHANDARI · JavaScript Project</p>
    <h1>GitHub Profile Finder</h1>
    <p>Look up a public GitHub profile using the GitHub API.</p>
    <form id="form" class="row">
      <input id="user" placeholder="GitHub username" autocomplete="off" required>
      <button type="submit">Find profile</button>
    </form>
    <div id="output" aria-live="polite"></div>
  </main>
  <script src="script.js"></script>
</body>
</html>
