<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Movie Search</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <p>BHUPAL SINGH BHANDARI · JavaScript Project</p>
    <h1>Movie Search</h1>
    <p>Search the OMDb catalogue and render results dynamically.</p>
    <form id="form" class="row">
      <input id="query" placeholder="Search a movie" autocomplete="off" required>
      <button type="submit">Search</button>
    </form>
    <section id="grid" class="grid" aria-live="polite"></section>
  </main>
  <script src="script.js"></script>
</body>
</html>
