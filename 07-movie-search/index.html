<!doctype html><html lang="en"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Movie Search</title><style>body{font:16px system-ui;max-width:900px;margin:40px auto;padding:20px;background:#111;color:#eee}input,button{padding:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-top:20px}.card{background:#222;padding:14px;border-radius:10px}</style><h1>Movie Search</h1><input id="q" placeholder="Movie title"><button onclick="searchMovies()">Search</button><div class="grid" id="out"></div><script>async function searchMovies(){let qv=q.value.trim();if(!qv)return;out.textContent='Loading…';let r=await fetch(`https://www.omdbapi.com/?apikey=demo&s=${encodeURIComponent(qv)}`).then(x=>x.json());out.innerHTML=(r.Search||[]).map(m=>`<article class="card"><b>${m.Title}</b><br>${m.Year}</article>`).join('')||'No results';}</script>
