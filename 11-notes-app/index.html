<!doctype html><html lang="en"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notes App</title><style>body{font:16px system-ui;max-width:750px;margin:50px auto;padding:20px;background:#f3f4f6;color:#111}textarea{width:100%;min-height:220px;padding:12px}button{padding:10px;margin-top:8px}</style><h1>Notes</h1><textarea id="note" placeholder="Write a note..."></textarea><br><button onclick="save()">Save</button><button onclick="clearNote()">Clear</button><p id="status"></p><script>note.value=localStorage.note||'';function save(){localStorage.note=note.value;status.textContent='Saved locally.'}function clearNote(){note.value='';localStorage.removeItem('note');status.textContent='Cleared.'}</script>
