<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Notes App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <p>BHUPAL SINGH BHANDARI · JavaScript Project</p>
    <h1>Notes App</h1>
    <form id="form" class="editor">
      <input id="title" placeholder="Note title" required>
      <textarea id="body" placeholder="Write your note..." required></textarea>
      <button type="submit">Save note</button>
    </form>
    <section id="notes" class="notes" aria-live="polite"></section>
  </main>
  <script src="script.js"></script>
</body>
</html>
