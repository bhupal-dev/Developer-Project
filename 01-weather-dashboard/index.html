<!doctype html><html lang="en"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weather Dashboard</title><style>body{font:16px system-ui;max-width:760px;margin:60px auto;padding:20px;background:#0f172a;color:#e2e8f0}input,button{padding:12px;border-radius:8px;border:1px solid #475569}button{cursor:pointer}#out{margin-top:20px;padding:20px;border-radius:12px;background:#1e293b}</style><h1>Weather Dashboard</h1><input id="city" placeholder="Mumbai"><button onclick="go()">Search</button><div id="out">Enter a city.</div><script>async function go(){let c=city.value.trim();if(!c)return;out.textContent='Loading…';let g=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(c)}&count=1`).then(r=>r.json());if(!g.results?.[0])return out.textContent='City not found';let p=g.results[0],w=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p.latitude}&longitude=${p.longitude}&current=temperature_2m,wind_speed_10m`).then(r=>r.json());out.innerHTML=`<b>${p.name}</b><br>Temperature: ${w.current.temperature_2m}°C<br>Wind: ${w.current.wind_speed_10m} km/h`}</script>
