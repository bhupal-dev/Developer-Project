<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Weather Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <p>BHUPAL SINGH BHANDARI · JavaScript Project</p>
    <h1>Weather Dashboard</h1>
    <p>Search a city for current weather conditions.</p>
    <div class="row">
      <input id="city" placeholder="Mumbai" autocomplete="off" aria-label="City">
      <button id="search" type="button">Search</button>
    </div>
    <div id="output" aria-live="polite">Enter a city to begin.</div>
  </main>
  <script src="script.js"></script>
</body>
</html>
