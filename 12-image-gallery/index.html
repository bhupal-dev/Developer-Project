<!doctype html><html lang="en"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Gallery</title><style>body{font:16px system-ui;max-width:1000px;margin:40px auto;padding:20px;background:#111;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.grid img{width:100%;display:block;border-radius:10px}</style><h1>Image Gallery</h1><div class="grid" id="gallery"></div><script>gallery.innerHTML=Array.from({length:12},(_,i)=>`<img loading="lazy" src="https://picsum.photos/seed/bhupal${i}/500/350" alt="Gallery image ${i+1}">`).join('')</script>
