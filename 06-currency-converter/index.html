<!doctype html><html lang="en"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Currency Converter</title><style>body{font:16px system-ui;max-width:600px;margin:60px auto;padding:20px;background:#0f172a;color:#fff}input,select,button{padding:11px;margin:4px}</style><h1>Currency Converter</h1><input id="amount" type="number" value="1"><select id="from"><option>USD</option><option>INR</option><option>EUR</option></select><select id="to"><option>INR</option><option>USD</option><option>EUR</option></select><button onclick="convert()">Convert</button><p id="out"></p><script>async function convert(){out.textContent='Loading…';let x=await fetch(`https://api.frankfurter.app/latest?amount=${amount.value}&from=${from.value}&to=${to.value}`).then(r=>r.json());out.textContent=`${amount.value} ${from.value} = ${x.rates[to.value]} ${to.value}`}</script>
