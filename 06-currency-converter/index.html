<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Currency Converter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <p>BHUPAL SINGH BHANDARI · JavaScript Project</p>
    <h1>Currency Converter</h1>
    <form id="form">
      <input id="amount" type="number" min="0.01" step="0.01" value="1" required aria-label="Amount">
      <select id="from" aria-label="From currency"><option>USD</option><option>INR</option><option>EUR</option></select>
      <select id="to" aria-label="To currency"><option>INR</option><option>USD</option><option>EUR</option></select>
      <button type="submit">Convert</button>
    </form>
    <p id="result" aria-live="polite">Enter an amount and convert.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
