<!doctype html><html lang="en"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Markdown Editor</title><style>body{font:16px system-ui;display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:30px;padding:20px;background:#0f172a;color:#fff}textarea,.preview{min-height:500px;padding:18px;background:#1e293b;color:#fff;border-radius:10px}h1,h2{margin-top:0}</style><textarea id="src" oninput="render()" placeholder="# Hello\n\nWrite **markdown** here"></textarea><article id="preview" class="preview"></article><script>function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function render(){let s=esc(src.value);s=s.replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>').replace(/\*\*(.*?)\*\*/g,'<b>$1</b>').replace(/\n\n/g,'<br><br>');preview.innerHTML=s}render()</script>
