<!doctype html><html lang="en"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz App</title><style>body{font:18px system-ui;max-width:650px;margin:60px auto;padding:20px;background:#172033;color:#fff}button{display:block;padding:12px;margin:8px 0;width:100%;text-align:left}</style><h1>JavaScript Quiz</h1><div id="q"></div><div id="opts"></div><p id="score"></p><script>const qs=[['Which keyword declares a constant?',['let','const','var'],'const'],['Which method parses JSON?',['JSON.parse','JSON.stringify','JSON.load'],'JSON.parse'],['Which stores browser data?',['localStorage','serverStorage','fileStorage'],'localStorage']];let i=0,s=0;function render(){if(i>=qs.length){q.textContent='Finished';opts.innerHTML='';score.textContent=`Score: ${s}/${qs.length}`;return}q.textContent=qs[i][0];opts.innerHTML=qs[i][1].map(o=>`<button onclick="answer('${o}')">${o}</button>`).join('')}function answer(o){if(o===qs[i][2])s++;i++;render()}render()</script>
