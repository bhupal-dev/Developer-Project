<!doctype html><html lang="en"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Password Generator</title><style>body{font:16px system-ui;max-width:650px;margin:60px auto;padding:20px;background:#111827;color:#fff}input,button{padding:12px;margin:4px}</style><h1>Password Generator</h1><input id="len" type="number" min="8" max="64" value="16"><button onclick="make()">Generate</button><input id="out" readonly style="width:90%"><script>function make(){let n=+len.value,chars='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%^&*';let a=new Uint32Array(n);crypto.getRandomValues(a);out.value=Array.from(a,x=>chars[x%chars.length]).join('')}</script>
