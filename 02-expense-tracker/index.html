<!doctype html><html lang="en"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expense Tracker</title><style>body{font:16px system-ui;max-width:650px;margin:50px auto;padding:20px;background:#111827;color:#f3f4f6}input,button{padding:10px;margin:4px}li{margin:8px 0}</style><h1>Expense Tracker</h1><input id="name" placeholder="Expense"><input id="amt" type="number" placeholder="Amount"><button onclick="add()">Add</button><h2>Total: ₹<span id="total">0</span></h2><ul id="list"></ul><script>let data=JSON.parse(localStorage.expenses||'[]');function render(){list.innerHTML=data.map((x,i)=>`<li>${x.name} — ₹${x.amt} <button onclick="del(${i})">×</button></li>`).join('');total.textContent=data.reduce((s,x)=>s+x.amt,0).toFixed(2);localStorage.expenses=JSON.stringify(data)}function add(){let n=name.value.trim(),a=Number(amt.value);if(!n||a<=0)return;data.push({name:n,amt:a});name.value=amt.value='';render()}function del(i){data.splice(i,1);render()}render()</script>
