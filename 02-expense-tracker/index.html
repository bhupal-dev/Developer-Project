<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <p>BHUPAL SINGH BHANDARI · JavaScript Project</p>
    <h1>Expense Tracker</h1>
    <form id="form">
      <input id="name" placeholder="Expense name" required>
      <input id="amount" type="number" min="0.01" step="0.01" placeholder="Amount" required>
      <button type="submit">Add expense</button>
    </form>
    <div class="summary" id="total">Total: ₹0.00</div>
    <ul id="list"></ul>
  </main>
  <script src="script.js"></script>
</body>
</html>
